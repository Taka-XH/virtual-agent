services:
  openclaw-gateway:
    environment:
      OPENCLAW_AGENT_RUNTIME: pi
    tmpfs:
      - /tmp:mode=1777

  ha-bridge:
    build:
      context: ./ha-bridge
    env_file:
      - .env
    environment:
      SPEAK_URL: http://interaction-bridge:8090/speak
      SPEAK_ENABLED: "1"
    ports:
      - "18088:8088"
    restart: unless-stopped

  interaction-bridge:
    build:
      context: ./interaction-bridge
    env_file:
      - .env
    environment:
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      ORCHESTRATION_ENABLED: "${ORCHESTRATION_ENABLED:-false}"
      ORCHESTRATOR_LLM_ENABLED: "${ORCHESTRATOR_LLM_ENABLED:-true}"
      ORCHESTRATOR_MODEL: "${ORCHESTRATOR_MODEL:-gpt-4o-mini}"
      ORCHESTRATOR_TIMEOUT_SECONDS: "${ORCHESTRATOR_TIMEOUT_SECONDS:-2.5}"
      HA_BRIDGE_URL: "${HA_BRIDGE_URL:-http://ha-bridge:8088}"
      CASUAL_CHAT_ENABLED: "${CASUAL_CHAT_ENABLED:-true}"
      CASUAL_CHAT_MODEL: "${CASUAL_CHAT_MODEL:-gpt-4o-mini}"
      CASUAL_CHAT_TIMEOUT_SECONDS: "${CASUAL_CHAT_TIMEOUT_SECONDS:-8}"
      CASUAL_CHAT_MAX_HISTORY_MESSAGES: "${CASUAL_CHAT_MAX_HISTORY_MESSAGES:-8}"
      MEMORY_DB_PATH: "${MEMORY_DB_PATH:-/home/node/.openclaw/interaction-bridge-memory.sqlite3}"
      OPENCLAW_SESSION_TUNING_ENABLED: "${OPENCLAW_SESSION_TUNING_ENABLED:-false}"
      OPENCLAW_FAST_MODEL: "${OPENCLAW_FAST_MODEL:-}"
      OPENCLAW_BALANCED_MODEL: "${OPENCLAW_BALANCED_MODEL:-}"
      OPENCLAW_DEEP_MODEL: "${OPENCLAW_DEEP_MODEL:-}"
      OPENCLAW_DEEP_THINKING_LEVEL: "${OPENCLAW_DEEP_THINKING_LEVEL:-}"
      FOLLOW_UP_LISTEN_SECONDS: "${FOLLOW_UP_LISTEN_SECONDS:-8}"
    volumes:
      - ${OPENCLAW_CONFIG_DIR:-${HOME:-/tmp}/.openclaw}:/home/node/.openclaw
    ports:
      - "18089:8090"
    restart: unless-stopped
    depends_on:
      - openclaw-gateway
      - ha-bridge
